- name: install
  service: node
  command: npm ci

- name: generate-prisma-client
  service: node
  command: npx prisma generate

- name: migrate-database
  service: node
  command: npx prisma migrate deploy

- name: lint
  service: node
  command: npm run lint

- name: unit-tests
  service: node
  command: npm run test -- --ci --forceExit --passWithNoTests

- name: code-coverage
  service: node
  command: npm run test:cov -- --ci --forceExit

- name: build
  service: node
  command: npm run build

- name: docker-push
  service: app
  type: push
  image_name: juanflorez1326/expense-tracker-api
  registry: https://index.docker.io/v1/
  encrypted_dockercfg_path: dockercfg.encrypted
  tag: "{{.Branch}}-{{.BuildID}}"
